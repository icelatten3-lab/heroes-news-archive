<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>뉴스 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f5f3; --panel:#ffffff; --ink:#1d1b1a; --ink2:#5d5855; --ink3:#8f8985;
  --line:#e7e3df; --chip:#f0ece8; --accent:#8b1d3c; --accent-ink:#fff; --accent-soft:#f6e6eb;
  --star:#d99a00; --new:#0a7d4f; --new-soft:#e3f4ec; --danger:#b42318; --shadow:0 1px 2px rgba(0,0,0,.05);
  --star-ink:#8a5a00; --star-soft:#fdf3d7; --memo:#2f6db5; --memo-soft:#e6effa;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151413; --panel:#1f1d1c; --ink:#f1eeeb; --ink2:#bdb6b0; --ink3:#857e78;
    --line:#34302d; --chip:#2b2826; --accent:#e0577a; --accent-ink:#1a0a10; --accent-soft:#3a1d27;
    --star:#f2b931; --new:#4cc995; --new-soft:#173327; --danger:#f97066; --shadow:none;
    --star-ink:#f2c14e; --star-soft:#3a2e10; --memo:#7fb0ee; --memo-soft:#172638;
  }
}
:root[data-theme="dark"]{
  --bg:#151413; --panel:#1f1d1c; --ink:#f1eeeb; --ink2:#bdb6b0; --ink3:#857e78;
  --line:#34302d; --chip:#2b2826; --accent:#e0577a; --accent-ink:#1a0a10; --accent-soft:#3a1d27;
  --star:#f2b931; --new:#4cc995; --new-soft:#173327; --danger:#f97066; --shadow:none;
  --star-ink:#f2c14e; --star-soft:#3a2e10; --memo:#7fb0ee; --memo-soft:#172638;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

header{padding:28px 0 14px}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
.sub{margin-top:4px;color:var(--ink2);font-size:13.5px}
.sub b{color:var(--new);font-weight:600}
.head-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}

.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:8px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px}
.search:focus,select:focus,textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;max-width:170px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 11px;cursor:pointer;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;line-height:1.4;border:1px solid transparent;background:var(--chip);color:var(--ink2);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
/* 중요·메모·숨김 필터는 태그와 다른 모양: 사각 모서리 + 각자 색 */
.chip.flag{border-radius:7px;background:none;border-color:var(--line);color:var(--ink2)}
.chip.flag.star.on{background:var(--star-soft);border-color:var(--star);color:var(--star-ink)}
.chip.flag.has-memo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--memo);margin-right:2px}
.chip.flag.has-memo.on{background:var(--memo-soft);border-color:var(--memo);color:var(--memo)}
.chip.flag.hide.on{background:var(--chip);border-color:var(--ink3);color:var(--ink)}
.chip-sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.count{color:var(--ink3);font-size:13px;margin-left:auto}

/* 달력 */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head strong{font-size:15px}
.cal-nav{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:30px;cursor:pointer}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{text-align:center;font-size:12px;color:var(--ink3);padding-bottom:2px}
.cal-wd:first-child{color:var(--danger)}
.cal-d{aspect-ratio:1/0.82;border:1px solid transparent;border-radius:8px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13.5px;color:var(--ink3);padding:0;min-width:0}
.cal-d b{font-weight:500}
.cal-d small{font-size:11px;line-height:1;color:var(--ink2)}
.cal-d[data-day]{cursor:pointer;color:var(--ink)}
.cal-d[data-day]:hover{border-color:var(--ink3)}
.cal-d.l1{background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.cal-d.l2{background:color-mix(in srgb,var(--accent) 22%,var(--panel))}
.cal-d.l3{background:color-mix(in srgb,var(--accent) 36%,var(--panel))}
.cal-d.l4{background:color-mix(in srgb,var(--accent) 52%,var(--panel))}
.cal-d.today b{text-decoration:underline;text-underline-offset:3px}
.cal-d.sel{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-2px}
.cal-note{margin-top:8px;font-size:12px;color:var(--ink3)}

main{padding:6px 0 60px}
.day{margin-top:22px}
.day{margin-top:30px}
.day h2{margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day h2 .d{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.day h2 .rel{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.day h2 .n{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink2);background:var(--chip);padding:3px 10px;border-radius:999px}
.day h2 .n b{font-size:15px;color:var(--ink)}
.count b{color:var(--ink);font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.card+.card{margin-top:8px}
.card.starred{border-left:3px solid var(--star)}
.card.hid{opacity:.45}
.meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.meta .src{color:var(--ink2);font-weight:600}
.meta .src.unknown{font-weight:400;font-style:italic}
.meta .via{font-size:11.5px;padding:0 6px;border:1px solid var(--line);border-radius:4px}
.badge{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--new-soft);color:var(--new)}
.star{color:var(--star)}
.title{display:block;margin-top:3px;font-size:16px;font-weight:600;line-height:1.45;text-decoration:none;word-break:keep-all;overflow-wrap:anywhere}
.title:hover{text-decoration:underline;text-underline-offset:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.tag.auto{background:none;border-color:var(--line);color:var(--ink2)}
.memo{margin:8px 0 0;padding:8px 10px;background:var(--memo-soft);border-left:3px solid var(--memo);border-radius:6px;font-size:13.5px;white-space:pre-wrap;color:var(--ink)}
.memo .by{display:block;margin-top:2px;color:var(--ink3);font-size:12px}
.tools{display:flex;gap:4px;margin-left:auto}
.ib{border:0;background:none;cursor:pointer;color:var(--ink3);padding:2px 6px;border-radius:6px;font-size:13px}
.ib:hover{background:var(--chip);color:var(--ink)}
.ib.star-on{color:var(--star)}

.editor{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.editor textarea{width:100%;min-height:72px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;resize:vertical}
.editor .newtag{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:13px;width:110px}
.editor .hint{font-size:12px;color:var(--ink3);margin-top:6px}
.editor .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}

.more{display:block;margin:20px auto 0}
.empty{text-align:center;color:var(--ink3);padding:60px 0}
.editbar{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.editbar .sp{flex:1}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 6px}
dialog p{margin:0 0 12px;color:var(--ink2);font-size:13.5px}
dialog label{display:block;font-size:13px;color:var(--ink2);margin-top:10px}
dialog input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:4px}
dialog .actions{display:flex;justify-content:flex-end;gap:6px;margin-top:16px}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:1em}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
@media (max-width:560px){
  h1{font-size:20px}
  .toolbar{position:static}
  .count{margin-left:0;width:100%}
  select{max-width:none;flex:1}
  .seg button{padding:7px 9px}
  .cal{padding:10px}
  .cal-grid{gap:3px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div>
        <h1 id="title">뉴스 아카이브</h1>
        <div class="sub" id="sub">불러오는 중…</div>
      </div>
      <div class="head-actions">
        <button class="btn" id="csvBtn" title="현재 필터 결과를 엑셀용 CSV로 저장">CSV 저장</button>
        <button class="btn" id="runBtn" hidden title="예약 시간을 기다리지 않고 지금 바로 새 기사를 수집">⟳ 지금 수집</button>
        <button class="btn" id="editBtn" hidden>편집 모드</button>
      </div>
    </div>
    <div id="editbar"></div>
  </header>

  <div class="toolbar">
    <div class="row">
      <input class="search" id="q" type="search" placeholder="제목·언론사·태그 검색">
      <div class="seg" id="period">
        <button data-p="1">오늘</button><button data-p="3">3일</button><button data-p="7" class="on">7일</button><button data-p="30">30일</button><button data-p="all">전체</button><button data-p="cal" id="calBtn">📅 날짜</button>
      </div>
    </div>
    <div class="row">
      <select id="source"><option value="">모든 언론사</option></select>
      <div class="chips" id="tagChips"></div>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="cal" id="cal" hidden></div>
  <main id="list"><div class="empty">불러오는 중…</div></main>
</div>

<dialog id="tokenDlg">
  <form method="dialog" id="tokenForm">
    <h3>편집 모드 켜기</h3>
    <p>GitHub 토큰을 입력하면 메모를 보고, 메모·태그를 편집할 수 있습니다. 토큰은 이 브라우저에만 저장됩니다.</p>
    <label>GitHub 토큰<input id="tokInput" type="password" autocomplete="off" required></label>
    <label>표시할 이름 (메모 작성자로 남음)<input id="nameInput" type="text" maxlength="20" placeholder="예: 홍보팀 김OO"></label>
    <div class="err" id="tokErr"></div>
    <div class="actions">
      <button class="btn" value="cancel" formnovalidate>취소</button>
      <button class="btn primary" id="tokOk" value="ok">확인</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
};
const bust = () => '?t=' + Date.now();
const kstNow = () => new Date(Date.now() + 9 * 3600e3).toISOString();
const kstToday = () => kstNow().slice(0, 10);
const addDays = (ymd, n) => new Date(Date.parse(ymd + 'T00:00:00Z') + n * 86400e3).toISOString().slice(0, 10);
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 7); };
const WD = ['일','월','화','수','목','금','토'];
const dayLabel = d => { const dt = new Date(d + 'T00:00:00Z'); return `${dt.getUTCMonth() + 1}월 ${dt.getUTCDate()}일 (${WD[dt.getUTCDay()]})`; };
// 주소 끝에 ?edit 또는 #edit 를 붙여 들어오면 편집 버튼이 보임 (토큰이 저장된 브라우저는 항상 보임)
const wantsEdit = /[?&#]edit\b/.test(location.search + location.hash);

let cfg = {}, index = {months: []}, ann = {}, memos = {};
const items = [], loaded = new Set();
const f = {q: '', period: '7', date: '', source: '', tags: new Set(), star: false, memo: false, showHidden: false};
let editor = null;          // {token, name, repo, memoRepo}
let openEditor = null;      // 편집 중인 기사 id
let limit = 200;
let calOpen = false, calMonth = kstToday().slice(0, 7);
const prevSeen = ls.get('na-lastSeen', '');

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }

async function getJSON(url){ const r = await fetch(url + bust(), {cache: 'no-store'}); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }

function detectRepo(){
  if (cfg.repo) return cfg.repo;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return '';
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return seg ? `${m[1]}/${seg}` : `${m[1]}/${location.hostname}`;
}

async function loadMonth(m){
  if (loaded.has(m) || !index.months.some(x => x.m === m)) return;
  loaded.add(m);
  try { items.push(...await getJSON(`data/${m}.json`)); }
  catch (e) { console.warn(e); }
  items.sort((a, b) => b.pub.localeCompare(a.pub));
}

async function ensureMonthsForPeriod(){
  const months = index.months.map(x => x.m);
  if (f.period === 'all') { for (const m of months) await loadMonth(m); return; }
  if (f.period === 'day') { await loadMonth(f.date.slice(0, 7)); return; }
  const from = addDays(kstToday(), -(+f.period - 1)).slice(0, 7);
  for (const m of months) if (m >= from) await loadMonth(m);
}

/* ---------- 메모 (토큰 있는 사람만, 비공개 저장소) ---------- */
function memoOf(id){
  if (!editor) return '';
  if (memos[id]) return memos[id].memo || '';
  const legacy = ann[id]?.memo;                    // 예전 버전에서 공개 파일에 저장된 메모
  return typeof legacy === 'string' ? legacy : '';
}
const hasMemo = id => !!memoOf(id);

/* ---------- 태그 ---------- */
const byId = id => items.find(x => x.id === id);
// 편집자가 태그를 손대면 annotations 의 tags 가 우선, 아니면 자동 태그
const tagsOf = it => { const a = ann[it.id]; return a && Array.isArray(a.tags) ? a.tags : (it.auto || []); };
const isAutoTags = it => { const a = ann[it.id]; return !(a && Array.isArray(a.tags)); };
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));

function allTags(){
  const s = new Set(cfg.tags || []);
  Object.keys(cfg.autoTags || {}).forEach(t => s.add(t));
  for (const [id, a] of Object.entries(ann)) if (id !== '_meta') (a.tags || []).forEach(t => s.add(t));
  return [...s];
}

/* ---------- 필터 ---------- */
function visible(){
  const from = (f.period === 'all' || f.period === 'day') ? '' : addDays(kstToday(), -(+f.period - 1));
  const q = f.q.trim().toLowerCase();
  return items.filter(it => {
    const a = ann[it.id] || {};
    if (a.hidden && !(editor && f.showHidden)) return false;
    if ((it.dup || it.nonNews) && !hasMemo(it.id) && !a.star) return false;   // 포털 사본으로 밝혀진 중복 기사, 블로그·카페 글
    if (f.period === 'day' && it.pub.slice(0, 10) !== f.date) return false;
    if (from && it.pub.slice(0, 10) < from) return false;
    if (f.source && it.source !== f.source) return false;
    if (f.star && !a.star) return false;
    if (f.memo && !hasMemo(it.id)) return false;
    const tags = tagsOf(it);
    if (f.tags.size && !tags.some(t => f.tags.has(t))) return false;
    if (q && !(it.title + ' ' + it.source + ' ' + (it.portal || '') + ' ' + memoOf(it.id) + ' ' + tags.join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
}

/* ---------- 렌더 ---------- */
function renderChips(){
  $('#tagChips').innerHTML =
    `<button class="chip flag star ${f.star ? 'on' : ''}" data-chip="star">★ 중요</button>` +
    (editor ? `<button class="chip flag has-memo ${f.memo ? 'on' : ''}" data-chip="memo">메모 있음</button>` : '') +
    (editor ? `<button class="chip flag hide ${f.showHidden ? 'on' : ''}" data-chip="hidden">숨긴 기사 보기</button>` : '') +
    '<span class="chip-sep" aria-hidden="true"></span>' +
    allTags().map(t => `<button class="chip ${f.tags.has(t) ? 'on' : ''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('');
}

function renderSources(){
  const cnt = {};
  items.forEach(it => cnt[it.source] = (cnt[it.source] || 0) + 1);
  const sel = $('#source');
  sel.innerHTML = '<option value="">모든 언론사</option>' +
    Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<option value="${esc(s)}">${esc(s)} (${n})</option>`).join('');
  sel.value = f.source;
}

function renderPeriod(){
  $('#period').querySelectorAll('button').forEach(b => {
    const p = b.dataset.p;
    b.classList.toggle('on', p === 'cal' ? (f.period === 'day' || calOpen) : p === f.period);
  });
  $('#calBtn').textContent = f.period === 'day' ? `📅 ${+f.date.slice(5, 7)}/${+f.date.slice(8, 10)}` : '📅 날짜';
}

async function renderCal(){
  const box = $('#cal');
  box.hidden = !calOpen;
  if (!calOpen) return;
  await loadMonth(calMonth);
  const cnt = {};
  items.forEach(it => {
    if (!it.pub.startsWith(calMonth) || (ann[it.id] || {}).hidden || it.dup || it.nonNews) return;
    const d = it.pub.slice(0, 10); cnt[d] = (cnt[d] || 0) + 1;
  });
  const max = Math.max(1, ...Object.values(cnt));
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const months = index.months.map(x => x.m);
  const minM = months.length ? months[months.length - 1] : calMonth;
  const maxM = kstToday().slice(0, 7);
  const today = kstToday();
  let cells = WD.map(w => `<div class="cal-wd">${w}</div>`).join('');
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const ymd = `${calMonth}-${String(d).padStart(2, '0')}`;
    const n = cnt[ymd] || 0;
    const lvl = n ? Math.min(4, Math.ceil(n / max * 4)) : 0;
    const cls = ['cal-d', lvl ? 'l' + lvl : '', ymd === today ? 'today' : '', f.period === 'day' && f.date === ymd ? 'sel' : ''].join(' ');
    cells += n
      ? `<button class="${cls}" data-day="${ymd}" title="${dayLabel(ymd)} · ${n}건"><b>${d}</b><small>${n}</small></button>`
      : `<div class="${cls}"><b>${d}</b></div>`;
  }
  box.innerHTML = `<div class="cal-head">
      <button class="cal-nav" data-nav="-1" ${calMonth <= minM ? 'disabled' : ''} aria-label="이전 달">‹</button>
      <strong>${y}년 ${m}월</strong>
      <button class="cal-nav" data-nav="1" ${calMonth >= maxM ? 'disabled' : ''} aria-label="다음 달">›</button>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-note">숫자는 그날 기사 수 · 색이 진할수록 기사가 많은 날</div>`;
}

function sourceHTML(it){

  const pending = !it.source || (it.portal && it.source === it.portal) || /^(네이트|Daum|다음|네이버|NAVER|ZUM|줌|MSN)$/i.test(it.source);
  const unknown = pending || it.source === '언론사 미확인';
  return `<span class="src ${unknown ? 'unknown' : ''}">${esc(pending ? '언론사 확인 중' : it.source)}</span>` +
    (it.portal ? `<span class="via" title="이 기사는 ${esc(it.portal)}에 실린 기사로 수집됨">${esc(it.portal)} 경유</span>` : '');

function cardHTML(it){
  const a = ann[it.id] || {};
  const isNew = prevSeen && it.got && it.got > prevSeen;
  const tools = editor ? `<span class="tools">
      <button class="ib ${a.star ? 'star-on' : ''}" data-act="star" title="중요 표시">${a.star ? '★' : '☆'}</button>
      <button class="ib" data-act="edit" title="메모·태그 편집">메모·태그</button>
      <button class="ib" data-act="hide" title="${a.hidden ? '다시 보이기' : '관련 없는 기사 숨기기'}">${a.hidden ? '보이기' : '숨김'}</button>
    </span>` : (a.star ? '<span class="star" title="중요">★</span>' : '');
  const tags = tagsOf(it), auto = isAutoTags(it);
  const memo = memoOf(it.id), mr = memos[it.id] || {};
  let html = `<article class="card ${a.star ? 'starred' : ''} ${a.hidden ? 'hid' : ''}" data-id="${esc(it.id)}">
    <div class="meta"><span>${it.pub.slice(11, 16)}</span>${sourceHTML(it)}${isNew ? '<span class="badge">NEW</span>' : ''}${tools}</div>
    <a class="title" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>`;
  if (tags.length) html += `<div class="tags">${tags.map(t => `<span class="tag ${auto ? 'auto' : ''}" ${auto ? 'title="자동 분류"' : ''}>#${esc(t)}</span>`).join('')}</div>`;
  if (memo) html += `<div class="memo">${esc(memo)}${mr.by ? `<span class="by">— ${esc(mr.by)}${mr.at ? ' · ' + esc(mr.at.slice(5, 10).replace('-', '/')) : ''}</span>` : ''}</div>`;
  if (openEditor === it.id) html += editorHTML(it);
  return html + '</article>';
}

function editorHTML(it){

    <div class="chips">
      ${allTags().map(t => `<button class="chip ${cur.has(t) ? 'on' : ''}" data-pick="${esc(t)}">#${esc(t)}</button>`).join('')}

    ${isAutoTags(it) && cur.size ? '<div class="hint">자동 분류된 태그가 선택돼 있습니다. 고쳐서 저장하면 직접 고른 태그로 바뀝니다.</div>' : ''}
    <textarea placeholder="메모 (토큰이 있는 사람만 볼 수 있음)" style="margin-top:8px">${esc(memoOf(it.id))}</textarea>
    <div class="actions"><button class="btn" data-act="cancel">취소</button><button class="btn primary" data-act="save">저장</button></div>

  const today = kstToday(), yday = addDays(today, -1);
  $('#count').innerHTML = `총 <b>${list.length.toLocaleString()}</b>건`;
  if (!list.length) {
    $('#list').innerHTML = `<div class="empty">${!items.length ? '아직 수집된 기사가 없습니다.' : f.period === 'day' ? `${dayLabel(f.date)}에는 조건에 맞는 기사가 없습니다.` : '조건에 맞는 기사가 없습니다.'}</div>`;

  const shown = list.slice(0, limit);

  let html = '';

/* ---------- GitHub 저장 ---------- */
const te = new TextEncoder(), td = new TextDecoder();
const b64enc = s => { const u8 = te.encode(s); let bin = ''; for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => td.decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const ghHeaders = () => ({Authorization: `Bearer ${editor.token}`, Accept: 'application/vnd.github+json'});
const fileUrl = (repo, path) => `https://api.github.com/repos/${repo}/contents/${path}`;
const ANN = () => [editor.repo, 'docs/annotations.json'];
const MEMO = () => [editor.memoRepo, 'memos.json'];

async function ghGet([repo, path]){
  const r = await fetch(fileUrl(repo, path) + bust(), {headers: ghHeaders(), cache: 'no-store'});
  if (r.status === 404) return {sha: null, data: {}};
  if (r.status === 401) throw new Error('토큰이 올바르지 않거나 만료되었습니다.');
  if (!r.ok) throw new Error(`불러오기 실패 (${r.status})`);
  const j = await r.json();
  return {sha: j.sha, data: JSON.parse(b64dec(j.content) || '{}')};
}

// 최신 파일을 받아 mutate 로 고친 뒤 저장. 동시 저장 충돌이면 다시 받아서 재시도
async function ghSave(target, mutate, message){
  const [repo, path] = target;
  for (let i = 0; i < 3; i++) {
    const {sha, data} = await ghGet(target);
    mutate(data);
    const body = {message, content: b64enc(JSON.stringify(data, null, 1) + '\n')};
    if (sha) body.sha = sha;
    const r = await fetch(fileUrl(repo, path), {method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body)});
    if (r.ok) return data;
    if (r.status === 409 || r.status === 422) continue;
    if (r.status === 403 || r.status === 404) throw new Error(`이 토큰에는 ${repo} 저장소 쓰기 권한이 없습니다.`);
    throw new Error(`저장 실패 (${r.status})`);
  }
  throw new Error('다른 저장과 겹쳐 실패했습니다. 다시 시도해 주세요.');
}

// 공개 기록: 태그·중요·숨김만 (메모는 절대 넣지 않음)
function pubRec(a){
  const rec = {};
  if (Array.isArray(a.tags)) rec.tags = a.tags;   // 빈 배열 = "자동 태그도 빼기"
  if (a.star) rec.star = true;
  if (a.hidden) rec.hidden = true;
  if (!Object.keys(rec).length) return null;
  rec.by = editor.name || ''; rec.at = kstNow().slice(0, 16);
  return rec;
}

async function update(id, patch, label, btn){
  if (btn) btn.disabled = true;
  const title = (byId(id)?.title || id).slice(0, 40);
  try {
    const legacy = typeof ann[id]?.memo === 'string';
    if (legacy && !('memoText' in patch)) patch = {...patch, memoText: ann[id].memo};   // 예전 공개 메모 → 비공개 저장소로 옮김
    // 메모를 먼저 비공개 저장소에 저장 (실패하면 공개 기록은 건드리지 않음)
    if ('memoText' in patch && (patch.memoText !== memoOf(id) || legacy)) {
      const t = patch.memoText;
      memos = await ghSave(MEMO(), d => { if (t) d[id] = {memo: t, by: editor.name || '', at: kstNow().slice(0, 16), title}; else delete d[id]; }, `메모: ${title}`);
    }
    const pubKeys = ['tags', 'star', 'hidden'].filter(k => k in patch);
    if (pubKeys.length || legacy) {
      const next = {...(ann[id] || {})};
      for (const k of pubKeys) next[k] = patch[k];
      if ('tags' in patch) { const it = byId(id); if (it && sameSet(patch.tags, it.auto || [])) delete next.tags; }   // 자동 태그와 같으면 저장 안 함
      const cur = ann[id] || {};
      const changed = legacy || pubKeys.some(k => JSON.stringify(cur[k] ?? null) !== JSON.stringify(next[k] ?? null));
      if (changed) {
        const rec = pubRec(next);
        ann = await ghSave(ANN(), d => { if (rec) d[id] = rec; else delete d[id]; }, `${label}: ${title}`);
      }
    }
    toast('저장했습니다.');
    if ('memoText' in patch) openEditor = null;
    renderChips(); render(); renderCal();
  } catch (e) {
    toast(e.message);
    if (btn) btn.disabled = false;
  }
}

async function enterEdit(token, name){
  const repo = detectRepo();
  if (!repo) throw new Error('저장소를 알 수 없습니다. config.json 의 repo 에 "아이디/저장소이름"을 적어 주세요.');
  const memoRepo = cfg.memoRepo || `${repo}-memo`;
  editor = {token, name, repo, memoRepo};
  try {
    // 메모 저장소: 토큰으로 접근 가능 + 반드시 비공개
    const r = await fetch(`https://api.github.com/repos/${memoRepo}` + bust(), {headers: ghHeaders(), cache: 'no-store'});
    if (r.status === 401) throw new Error('토큰이 올바르지 않거나 만료되었습니다.');
    if (!r.ok) throw new Error(`메모 저장소(${memoRepo})를 찾을 수 없습니다. 비공개 저장소를 만들고 토큰 권한에 포함했는지 확인해 주세요.`);
    if (!(await r.json()).private) throw new Error(`메모 저장소(${memoRepo})가 공개 상태입니다. Settings에서 Private으로 바꿔 주세요.`);
    ann = (await ghGet(ANN())).data;
    memos = (await ghGet(MEMO())).data;
  } catch (e) { editor = null; memos = {}; throw e; }
  ls.set('na-token', token); ls.set('na-name', name);
}

/* ---------- 지금 수집 (GitHub Actions 수동 실행) ---------- */
let running = null;   // {label}
const WF = () => `https://api.github.com/repos/${editor.repo}/actions/workflows/fetch.yml`;
const sleep = ms => new Promise(s => setTimeout(s, ms));
function setRunLabel(label){ running = {label}; renderHeader(); }

async function latestRun(){
  const r = await fetch(`${WF()}/runs?per_page=1` + bust().replace('?', '&'), {headers: ghHeaders(), cache: 'no-store'});
  if (!r.ok) return null;
  return (await r.json()).workflow_runs?.[0] || null;
}

async function runNow(){
  if (!editor || running) return;
  const started = Date.now();
  const elapsed = () => { const s = Math.round((Date.now() - started) / 1000); return `${Math.floor(s / 60)}분 ${s % 60}초`; };
  try {
    setRunLabel('시작');
    const before = await latestRun();
    const r = await fetch(`${WF()}/dispatches`, {method: 'POST', headers: ghHeaders(), body: JSON.stringify({ref: 'main', inputs: {backfill_days: '0'}})});
    if (r.status === 403 || r.status === 404) throw new Error('이 토큰에는 수집 실행 권한이 없습니다. 토큰 권한에 Actions: Read and write 를 추가해 주세요.');
    if (!r.ok) throw new Error(`수집 실행 실패 (${r.status})`);
    toast('수집을 시작했습니다. 보통 2~4분 걸립니다.');
    // 1) 새 실행이 끝날 때까지 기다림
    let run = null;
    for (let i = 0; i < 60; i++) {
      await sleep(8000);
      run = await latestRun();
      if (run && (!before || run.id !== before.id)) {
        setRunLabel(run.status === 'completed' ? '반영 중 ' + elapsed() : elapsed());
        if (run.status === 'completed') break;
      } else setRunLabel('대기 ' + elapsed());
    }
    if (!run || run.status !== 'completed') throw new Error('수집이 오래 걸리고 있습니다. GitHub Actions 탭에서 확인해 주세요.');
    if (run.conclusion !== 'success') throw new Error('수집이 실패했습니다. GitHub Actions 탭에서 로그를 확인해 주세요.');
    // 2) 웹페이지(Pages)에 새 데이터가 올라올 때까지 기다린 뒤 다시 불러옴
    const old = index.updated;
    for (let i = 0; i < 24; i++) {
      await sleep(10000);
      setRunLabel('반영 중 ' + elapsed());
      let idx = null;
      try { idx = await getJSON('data/index.json'); } catch {}
      if (idx && idx.updated !== old) {
        index = idx;
        const months = [...loaded]; loaded.clear(); items.length = 0;
        for (const m of months) await loadMonth(m);
        await ensureMonthsForPeriod();
        running = null; renderAll();
        toast(`수집 완료 · 새 기사 ${idx.added ?? 0}건`);
        return;
      }
    }
    throw new Error('수집은 끝났지만 웹페이지 반영이 늦어지고 있습니다. 잠시 뒤 새로고침해 주세요.');
  } catch (e) {
    toast(e.message);
  }
  running = null; renderHeader();
}

$('#tagChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tag) { f.tags.has(b.dataset.tag) ? f.tags.delete(b.dataset.tag) : f.tags.add(b.dataset.tag); }
  else if (b.dataset.chip === 'star') f.star = !f.star;
  else if (b.dataset.chip === 'memo') f.memo = !f.memo;

$('#list').addEventListener('click', e => {

  const card = e.target.closest('.card'); if (!card || !editor) return;
  const id = card.dataset.id, a = ann[id] || {};
  const pick = e.target.closest('[data-pick]');
  if (pick) { pick.classList.toggle('on'); return; }
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'star') update(id, {star: !a.star}, a.star ? '중요 해제' : '중요 표시', btn);
  else if (act === 'hide') update(id, {hidden: !a.hidden}, a.hidden ? '숨김 해제' : '숨김', btn);
  else if (act === 'edit') { openEditor = openEditor === id ? null : id; render(); document.querySelector(`[data-id="${CSS.escape(id)}"] textarea`)?.focus(); }
  else if (act === 'cancel') { openEditor = null; render(); }
  else if (act === 'save') {
    const tags = [...card.querySelectorAll('[data-pick].on')].map(x => x.dataset.pick);
    const extra = card.querySelector('.newtag').value.trim().replace(/^#/, '');
    if (extra && !tags.includes(extra)) tags.push(extra);

  }
});

});
document.addEventListener('click', e => {
  if (e.target.id === 'logoutBtn') { editor = null; memos = {}; openEditor = null; f.showHidden = false; f.memo = false; ls.set('na-token', null); renderAll(); toast('편집 모드를 껐습니다.'); }
});

$('#csvBtn').addEventListener('click', () => {
  const head = ['날짜', '시간', '언론사', '경유 포털', '제목', '링크', '태그', '중요'];
  const rows = [editor ? [...head, '메모'] : head];
  visible().forEach(it => {
    const a = ann[it.id] || {};
    const row = [it.pub.slice(0, 10), it.pub.slice(11, 16), it.source, it.portal || '', it.title, it.link, tagsOf(it).join(' '), a.star ? '★' : ''];
    rows.push(editor ? [...row, memoOf(it.id)] : row);
  });
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  const a = Object.assign(document.createElement('a'), {href: url, download: `뉴스아카이브_${f.period === 'day' ? f.date : kstToday()}.csv`});
  a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
});

/* ---------- 시작 ---------- */
(async () => {
  try {
    cfg = await getJSON('config.json');
    try { index = await getJSON('data/index.json'); } catch { index = {months: []}; }
    try { ann = await getJSON('annotations.json'); } catch { ann = {}; }
    await ensureMonthsForPeriod();
    const tok = ls.get('na-token', '');
    if (tok) { try { await enterEdit(tok, ls.get('na-name', '')); } catch (e) { toast('편집 모드 해제: ' + e.message); } }
    renderAll();
    if (index.updated) ls.set('na-lastSeen', index.updated);
  } catch (e) {
    $('#list').innerHTML = `<div class="empty">불러오지 못했습니다. (${esc(e.message)})</div>`;
  }
})();
})();
</script>
</body>
</html>
