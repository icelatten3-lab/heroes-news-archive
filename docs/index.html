<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>뉴스 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f5f3; --panel:#ffffff; --ink:#1d1b1a; --ink2:#5d5855; --ink3:#8f8985;
  --line:#e7e3df; --chip:#f0ece8; --accent:#8b1d3c; --accent-ink:#fff; --accent-soft:#f6e6eb;
  --star:#d99a00; --new:#0a7d4f; --new-soft:#e3f4ec; --danger:#b42318; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151413; --panel:#1f1d1c; --ink:#f1eeeb; --ink2:#bdb6b0; --ink3:#857e78;
    --line:#34302d; --chip:#2b2826; --accent:#e0577a; --accent-ink:#1a0a10; --accent-soft:#3a1d27;
    --star:#f2b931; --new:#4cc995; --new-soft:#173327; --danger:#f97066; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#151413; --panel:#1f1d1c; --ink:#f1eeeb; --ink2:#bdb6b0; --ink3:#857e78;
  --line:#34302d; --chip:#2b2826; --accent:#e0577a; --accent-ink:#1a0a10; --accent-soft:#3a1d27;
  --star:#f2b931; --new:#4cc995; --new-soft:#173327; --danger:#f97066; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

header{padding:28px 0 14px}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
.sub{margin-top:4px;color:var(--ink2);font-size:13.5px}
.sub b{color:var(--new);font-weight:600}
.head-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}

.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:8px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px}
.search:focus,select:focus,textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;max-width:170px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 11px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid transparent;background:var(--chip);color:var(--ink2);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.count{color:var(--ink3);font-size:13px;margin-left:auto}

main{padding:6px 0 60px}
.day{margin-top:22px}
.day h2{font-size:14px;color:var(--ink2);margin:0 0 8px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.day h2 .n{color:var(--ink3);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.card+.card{margin-top:8px}
.card.starred{border-left:3px solid var(--star)}
.card.hid{opacity:.45}
.meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.meta .src{color:var(--ink2);font-weight:600}
.badge{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--new-soft);color:var(--new)}
.star{color:var(--star)}
.title{display:block;margin-top:3px;font-size:16px;font-weight:600;line-height:1.45;text-decoration:none;word-break:keep-all;overflow-wrap:anywhere}
.title:hover{text-decoration:underline;text-underline-offset:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.memo{margin:8px 0 0;padding:8px 10px;background:var(--chip);border-radius:8px;font-size:13.5px;white-space:pre-wrap;color:var(--ink)}
.memo .by{display:block;margin-top:2px;color:var(--ink3);font-size:12px}
.tools{display:flex;gap:4px;margin-left:auto}
.ib{border:0;background:none;cursor:pointer;color:var(--ink3);padding:2px 6px;border-radius:6px;font-size:13px}
.ib:hover{background:var(--chip);color:var(--ink)}
.ib.star-on{color:var(--star)}

.editor{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.editor textarea{width:100%;min-height:72px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;resize:vertical}
.editor .newtag{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:13px;width:110px}
.editor .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}

.more{display:block;margin:20px auto 0}
.empty{text-align:center;color:var(--ink3);padding:60px 0}
.editbar{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.editbar .sp{flex:1}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 6px}
dialog p{margin:0 0 12px;color:var(--ink2);font-size:13.5px}
dialog label{display:block;font-size:13px;color:var(--ink2);margin-top:10px}
dialog input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:4px}
dialog .actions{display:flex;justify-content:flex-end;gap:6px;margin-top:16px}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:1em}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
@media (max-width:560px){
  h1{font-size:20px}
  .toolbar{position:static}
  .count{margin-left:0;width:100%}
  select{max-width:none;flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div>
        <h1 id="title">뉴스 아카이브</h1>
        <div class="sub" id="sub">불러오는 중…</div>
      </div>
      <div class="head-actions">
        <button class="btn" id="csvBtn" title="현재 필터 결과를 엑셀용 CSV로 저장">CSV 저장</button>
        <button class="btn" id="editBtn">편집 모드</button>
      </div>
    </div>
    <div id="editbar"></div>
  </header>

  <div class="toolbar">
    <div class="row">
      <input class="search" id="q" type="search" placeholder="제목·언론사·메모 검색">
      <div class="seg" id="period">
        <button data-p="1">오늘</button><button data-p="3">3일</button><button data-p="7" class="on">7일</button><button data-p="30">30일</button><button data-p="all">전체</button>
      </div>
    </div>
    <div class="row">
      <select id="source"><option value="">모든 언론사</option></select>
      <div class="chips" id="tagChips"></div>
      <span class="count" id="count"></span>
    </div>
  </div>

  <main id="list"><div class="empty">불러오는 중…</div></main>
</div>

<dialog id="tokenDlg">
  <form method="dialog" id="tokenForm">
    <h3>편집 모드 켜기</h3>
    <p>메모·태그를 저장하려면 이 저장소에 쓰기 권한이 있는 GitHub 토큰이 필요합니다. 토큰은 이 브라우저에만 저장되며, 다른 사람에게 보이지 않습니다.</p>
    <label>GitHub 토큰<input id="tokInput" type="password" autocomplete="off" required></label>
    <label>표시할 이름 (메모 작성자로 남음)<input id="nameInput" type="text" maxlength="20" placeholder="예: 홍보팀 김OO"></label>
    <div class="err" id="tokErr"></div>
    <div class="actions">
      <button class="btn" value="cancel" formnovalidate>취소</button>
      <button class="btn primary" id="tokOk" value="ok">확인</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
};
const bust = () => '?t=' + Date.now();
const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const addDays = (ymd, n) => new Date(Date.parse(ymd + 'T00:00:00Z') + n * 86400e3).toISOString().slice(0, 10);
const WD = ['일','월','화','수','목','금','토'];

let cfg = {}, index = {months: []}, ann = {};
const items = [], loaded = new Set();
const f = {q: '', period: '7', source: '', tags: new Set(), star: false, memo: false, showHidden: false};
let editor = null;          // {token, name, repo}
let openEditor = null;      // 편집 중인 기사 id
let limit = 200;
const prevSeen = ls.get('na-lastSeen', '');

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

async function getJSON(url){ const r = await fetch(url + bust(), {cache: 'no-store'}); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }

function detectRepo(){
  if (cfg.repo) return cfg.repo;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return '';
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return seg ? `${m[1]}/${seg}` : `${m[1]}/${location.hostname}`;
}

async function loadMonth(m){
  if (loaded.has(m)) return;
  loaded.add(m);
  try { items.push(...await getJSON(`data/${m}.json`)); }
  catch (e) { console.warn(e); }
  items.sort((a, b) => b.pub.localeCompare(a.pub));
}

async function ensureMonthsForPeriod(){
  const months = index.months.map(x => x.m);
  if (f.period === 'all') { for (const m of months) await loadMonth(m); return; }
  const from = addDays(kstToday(), -(+f.period - 1)).slice(0, 7);
  for (const m of months) if (m >= from) await loadMonth(m);
}

/* ---------- 필터 ---------- */
function visible(){
  const today = kstToday();
  const from = f.period === 'all' ? '' : addDays(today, -(+f.period - 1));
  const q = f.q.trim().toLowerCase();
  return items.filter(it => {
    const a = ann[it.id] || {};
    if (a.hidden && !(editor && f.showHidden)) return false;
    if (from && it.pub.slice(0, 10) < from) return false;
    if (f.source && it.source !== f.source) return false;
    if (f.star && !a.star) return false;
    if (f.memo && !a.memo) return false;
    if (f.tags.size && !(a.tags || []).some(t => f.tags.has(t))) return false;
    if (q && !(it.title + ' ' + it.source + ' ' + (a.memo || '') + ' ' + (a.tags || []).join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function allTags(){
  const s = new Set(cfg.tags || []);
  for (const a of Object.values(ann)) (a.tags || []).forEach(t => s.add(t));
  return [...s];
}

/* ---------- 렌더 ---------- */
function renderChips(){
  const tags = allTags();
  $('#tagChips').innerHTML =
    `<button class="chip ${f.star ? 'on' : ''}" data-chip="star">★ 중요</button>` +
    `<button class="chip ${f.memo ? 'on' : ''}" data-chip="memo">메모 있음</button>` +
    tags.map(t => `<button class="chip ${f.tags.has(t) ? 'on' : ''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('') +
    (editor ? `<button class="chip ${f.showHidden ? 'on' : ''}" data-chip="hidden">숨긴 기사 보기</button>` : '');
}

function renderSources(){
  const cnt = {};
  items.forEach(it => cnt[it.source] = (cnt[it.source] || 0) + 1);
  const sel = $('#source');
  sel.innerHTML = '<option value="">모든 언론사</option>' +
    Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<option value="${esc(s)}">${esc(s)} (${n})</option>`).join('');
  sel.value = f.source;
}

function cardHTML(it){
  const a = ann[it.id] || {};
  const isNew = prevSeen && it.got && it.got > prevSeen;
  const time = it.pub.slice(11, 16);
  const tools = editor ? `<span class="tools">
      <button class="ib ${a.star ? 'star-on' : ''}" data-act="star" title="중요 표시">${a.star ? '★' : '☆'}</button>
      <button class="ib" data-act="edit" title="메모·태그 편집">메모·태그</button>
      <button class="ib" data-act="hide" title="${a.hidden ? '다시 보이기' : '관련 없는 기사 숨기기'}">${a.hidden ? '보이기' : '숨김'}</button>
    </span>` : (a.star ? '<span class="star" title="중요">★</span>' : '');
  let html = `<article class="card ${a.star ? 'starred' : ''} ${a.hidden ? 'hid' : ''}" data-id="${esc(it.id)}">
    <div class="meta"><span>${time}</span><span class="src">${esc(it.source)}</span>${isNew ? '<span class="badge">NEW</span>' : ''}${tools}</div>
    <a class="title" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>`;
  if ((a.tags || []).length) html += `<div class="tags">${a.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>`;
  if (a.memo) html += `<div class="memo">${esc(a.memo)}${a.by ? `<span class="by">— ${esc(a.by)}${a.at ? ' · ' + esc(a.at.slice(5, 10).replace('-', '/')) : ''}</span>` : ''}</div>`;
  if (openEditor === it.id) html += editorHTML(a);
  return html + '</article>';
}

function editorHTML(a){
  const cur = new Set(a.tags || []);
  return `<div class="editor">
    <div class="chips" data-role="tagpick">
      ${allTags().map(t => `<button class="chip ${cur.has(t) ? 'on' : ''}" data-pick="${esc(t)}">#${esc(t)}</button>`).join('')}
      <input class="newtag" placeholder="+ 새 태그" maxlength="15">
    </div>
    <textarea placeholder="메모 (예: 보도자료 반영 기사, 대응 필요 등)" style="margin-top:8px">${esc(a.memo || '')}</textarea>
    <div class="actions"><button class="btn" data-act="cancel">취소</button><button class="btn primary" data-act="save">저장</button></div>
  </div>`;
}

function render(){
  const list = visible();
  const today = kstToday(), yday = addDays(today, -1);
  $('#count').textContent = `${list.length.toLocaleString()}건`;
  if (!list.length) {
    $('#list').innerHTML = `<div class="empty">${items.length ? '조건에 맞는 기사가 없습니다.' : '아직 수집된 기사가 없습니다.'}</div>`;
    return;
  }
  const shown = list.slice(0, limit);
  const groups = new Map();
  shown.forEach(it => { const d = it.pub.slice(0, 10); if (!groups.has(d)) groups.set(d, []); groups.get(d).push(it); });
  const dayTotal = {};
  list.forEach(it => { const d = it.pub.slice(0, 10); dayTotal[d] = (dayTotal[d] || 0) + 1; });
  let html = '';
  for (const [d, arr] of groups) {
    const dt = new Date(d + 'T00:00:00Z');
    const label = `${dt.getUTCMonth() + 1}월 ${dt.getUTCDate()}일 (${WD[dt.getUTCDay()]})` + (d === today ? ' · 오늘' : d === yday ? ' · 어제' : '');
    html += `<section class="day"><h2>${label}<span class="n">${dayTotal[d]}건</span></h2>${arr.map(cardHTML).join('')}</section>`;
  }
  if (list.length > limit) html += `<button class="btn more" id="moreBtn">더 보기 (${(list.length - limit).toLocaleString()}건 남음)</button>`;
  $('#list').innerHTML = html;
}

function renderHeader(){
  document.title = cfg.title || '뉴스 아카이브';
  $('#title').textContent = cfg.title || '뉴스 아카이브';
  const total = index.months.reduce((s, m) => s + m.n, 0);
  const newCnt = prevSeen ? items.filter(it => it.got && it.got > prevSeen).length : 0;
  const up = index.updated ? index.updated.slice(5, 16).replace('-', '/').replace('T', ' ') : '-';
  $('#sub').innerHTML = `마지막 수집 ${esc(up)} · 전체 ${total.toLocaleString()}건` +
    ((cfg.queries || []).length ? ` · 키워드: ${cfg.queries.map(esc).join(', ')}` : '') +
    (newCnt ? ` · <b>지난 방문 후 새 기사 ${newCnt}건</b>` : '');
  const eb = $('#editbar');
  $('#editBtn').classList.toggle('on', !!editor);
  $('#editBtn').textContent = editor ? '편집 모드 켜짐' : '편집 모드';
  eb.innerHTML = editor ? `<div class="editbar"><span>편집 모드 · ${esc(editor.name || '이름 없음')} · 저장하면 팀원 화면에는 1~2분 뒤 반영됩니다.</span><span class="sp"></span><button class="btn" id="logoutBtn">편집 모드 끄기</button></div>` : '';
}

function renderAll(){ renderHeader(); renderChips(); renderSources(); render(); }

/* ---------- GitHub 저장 ---------- */
const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const ghHeaders = () => ({Authorization: `Bearer ${editor.token}`, Accept: 'application/vnd.github+json'});
const ANN_URL = () => `https://api.github.com/repos/${editor.repo}/contents/docs/annotations.json`;

async function ghGet(){
  const r = await fetch(ANN_URL() + bust(), {headers: ghHeaders(), cache: 'no-store'});
  if (r.status === 404) return {sha: null, data: {}};
  if (r.status === 401) throw new Error('토큰이 올바르지 않거나 만료되었습니다.');
  if (!r.ok) throw new Error(`불러오기 실패 (${r.status})`);
  const j = await r.json();
  return {sha: j.sha, data: JSON.parse(b64dec(j.content) || '{}')};
}

async function saveAnn(id, rec, label){
  for (let i = 0; i < 3; i++) {
    const {sha, data} = await ghGet();
    if (rec) data[id] = rec; else delete data[id];
    const body = {message: `${label}: ${(items.find(x => x.id === id)?.title || id).slice(0, 40)}`, content: b64enc(JSON.stringify(data, null, 1) + '\n')};
    if (sha) body.sha = sha;
    const r = await fetch(ANN_URL(), {method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body)});
    if (r.ok) { ann = data; return; }
    if (r.status === 409 || r.status === 422) continue;   // 동시에 다른 사람이 저장 → 다시 받아서 재시도
    if (r.status === 403 || r.status === 404) throw new Error('이 토큰에는 저장소 쓰기 권한이 없습니다.');
    throw new Error(`저장 실패 (${r.status})`);
  }
  throw new Error('다른 저장과 겹쳐 실패했습니다. 다시 시도해 주세요.');
}

function cleanRec(a){
  const rec = {};
  if (a.tags && a.tags.length) rec.tags = a.tags;
  if (a.memo) rec.memo = a.memo;
  if (a.star) rec.star = true;
  if (a.hidden) rec.hidden = true;
  if (!Object.keys(rec).length) return null;
  rec.by = editor.name || ''; rec.at = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 16);
  return rec;
}

async function update(id, patch, label, btn){
  const next = cleanRec({...(ann[id] || {}), ...patch});
  if (btn) btn.disabled = true;
  try {
    await saveAnn(id, next, label);
    toast('저장했습니다.');
    if (label === '메모') openEditor = null;
    renderChips(); render();
  } catch (e) {
    toast(e.message);
    if (btn) btn.disabled = false;
  }
}

async function enterEdit(token, name){
  const repo = detectRepo();
  if (!repo) throw new Error('저장소를 알 수 없습니다. config.json 의 repo 에 "아이디/저장소이름"을 적어 주세요.');
  editor = {token, name, repo};
  try { ann = (await ghGet()).data; }
  catch (e) { editor = null; throw e; }
  ls.set('na-token', token); ls.set('na-name', name);
}

/* ---------- 이벤트 ---------- */
$('#q').addEventListener('input', e => { f.q = e.target.value; limit = 200; render(); });
$('#source').addEventListener('change', e => { f.source = e.target.value; limit = 200; render(); });
$('#period').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  f.period = b.dataset.p; limit = 200;
  $('#period').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  await ensureMonthsForPeriod(); renderSources(); render();
});
$('#tagChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tag) { f.tags.has(b.dataset.tag) ? f.tags.delete(b.dataset.tag) : f.tags.add(b.dataset.tag); }
  else if (b.dataset.chip === 'star') f.star = !f.star;
  else if (b.dataset.chip === 'memo') f.memo = !f.memo;
  else if (b.dataset.chip === 'hidden') f.showHidden = !f.showHidden;
  limit = 200; renderChips(); render();
});

$('#list').addEventListener('click', e => {
  if (e.target.id === 'moreBtn') { limit += 200; render(); return; }
  const card = e.target.closest('.card'); if (!card || !editor) return;
  const id = card.dataset.id, a = ann[id] || {};
  const pick = e.target.closest('[data-pick]');
  if (pick) { pick.classList.toggle('on'); return; }
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'star') update(id, {star: !a.star}, a.star ? '중요 해제' : '중요 표시', btn);
  else if (act === 'hide') update(id, {hidden: !a.hidden}, a.hidden ? '숨김 해제' : '숨김', btn);
  else if (act === 'edit') { openEditor = openEditor === id ? null : id; render(); card.isConnected || document.querySelector(`[data-id="${CSS.escape(id)}"] textarea`)?.focus(); }
  else if (act === 'cancel') { openEditor = null; render(); }
  else if (act === 'save') {
    const tags = [...card.querySelectorAll('[data-pick].on')].map(x => x.dataset.pick);
    const extra = card.querySelector('.newtag').value.trim().replace(/^#/, '');
    if (extra && !tags.includes(extra)) tags.push(extra);
    update(id, {tags, memo: card.querySelector('textarea').value.trim()}, '메모', btn);
  }
});
$('#list').addEventListener('keydown', e => {
  if (e.target.classList.contains('newtag') && e.key === 'Enter') {
    e.preventDefault();
    const v = e.target.value.trim().replace(/^#/, ''); if (!v) return;
    const b = document.createElement('button');
    b.className = 'chip on'; b.dataset.pick = v; b.textContent = '#' + v;
    e.target.before(b); e.target.value = '';
  }
});

$('#editBtn').addEventListener('click', () => {
  if (editor) return;
  $('#tokErr').textContent = ''; $('#tokInput').value = ''; $('#nameInput').value = ls.get('na-name', '');
  $('#tokenDlg').showModal();
});
$('#tokenForm').addEventListener('submit', async e => {
  if (e.submitter?.value !== 'ok') return;
  e.preventDefault();
  $('#tokOk').disabled = true; $('#tokErr').textContent = '';
  try {
    await enterEdit($('#tokInput').value.trim(), $('#nameInput').value.trim());
    $('#tokenDlg').close(); renderAll(); toast('편집 모드가 켜졌습니다.');
  } catch (err) { $('#tokErr').textContent = err.message; }
  $('#tokOk').disabled = false;
});
document.addEventListener('click', e => {
  if (e.target.id === 'logoutBtn') { editor = null; openEditor = null; f.showHidden = false; ls.set('na-token', null); renderAll(); toast('편집 모드를 껐습니다.'); }
});

$('#csvBtn').addEventListener('click', () => {
  const rows = [['날짜', '시간', '언론사', '제목', '링크', '태그', '메모', '중요']];
  visible().forEach(it => { const a = ann[it.id] || {}; rows.push([it.pub.slice(0, 10), it.pub.slice(11, 16), it.source, it.title, it.link, (a.tags || []).join(' '), a.memo || '', a.star ? '★' : '']); });
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  const a = Object.assign(document.createElement('a'), {href: url, download: `뉴스아카이브_${kstToday()}.csv`});
  a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
});

/* ---------- 시작 ---------- */
(async () => {
  try {
    cfg = await getJSON('config.json');
    try { index = await getJSON('data/index.json'); } catch { index = {months: []}; }
    try { ann = await getJSON('annotations.json'); } catch { ann = {}; }
    await ensureMonthsForPeriod();
    const tok = ls.get('na-token', '');
    if (tok) { try { await enterEdit(tok, ls.get('na-name', '')); } catch (e) { toast('편집 모드 해제: ' + e.message); } }
    renderAll();
    if (index.updated) ls.set('na-lastSeen', index.updated);
  } catch (e) {
    $('#list').innerHTML = `<div class="empty">불러오지 못했습니다. (${esc(e.message)})</div>`;
  }
})();
})();
</script>
</body>
